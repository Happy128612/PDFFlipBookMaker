<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to PDF Converter</title>
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input, select, button {
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    button:disabled {
      background-color: #475569;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    video {
      width: 100%;
      max-height: 350px;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }

    .progress {
      height: 8px;
      background-color: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 1rem;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.1s;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 0.5rem;
      text-align: center;
    }

    .pdf-preview-wrapper {
      margin-top: 20px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      display: none;
    }

    #pdfPreview {
      width: 100%;
      height: 500px;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Video to PDF Converter</h1>

    <div class="card">
      <div class="input-group">
        <label for="videoInput">Select Video File</label>
        <input type="file" id="videoInput" accept="video/*">
      </div>

      <video id="videoPlayer" controls preload="auto"></video>

      <div class="controls">
        <div class="input-group">
          <label for="extractionMode">Extraction Mode</label>
          <select id="extractionMode">
            <option value="interval">Time Interval (ms)</option>
            <option value="count">Total Number of Frames</option>
          </select>
        </div>

        <div class="input-group" id="intervalGroup">
          <label for="intervalMs">Time Interval (ms)</label>
          <input type="number" id="intervalMs" value="1000" min="10" step="10">
        </div>

        <div class="input-group" id="countGroup" style="display: none;">
          <label for="totalFrames">Total Frames</label>
          <input type="number" id="totalFrames" value="10" min="1" step="1">
        </div>

        <div class="input-group">
          <label for="pageSize">PDF Paper Size</label>
          <select id="pageSize">
            <option value="a6" selected>A6 (105 × 148 mm)</option>
            <option value="a4">A4 (210 × 297 mm)</option>
            <option value="letter">Letter (8.5 × 11 in)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="leftMarginInput">Left Margin (inches)</label>
          <input type="number" id="leftMarginInput" value="1.0" min="0" step="0.1">
        </div>

        <div class="input-group">
          <label for="scaleMode">Photo Scaling Mode</label>
          <select id="scaleMode">
            <option value="cover" selected>Scale & Crop (Proportional Fill)</option>
            <option value="stretch">Stretch to Page Bounds</option>
          </select>
        </div>

        <div class="input-group" style="justify-content: flex-end; grid-column: 1 / -1;">
          <button id="convertBtn" disabled>Convert Video directly to PDF</button>
        </div>
      </div>

      <div class="progress" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText"></div>
    </div>

    <div class="card pdf-preview-wrapper" id="pdfPreviewWrapper">
      <h2 style="margin-top:0;">PDF Preview</h2>
      <embed id="pdfPreview" type="application/pdf">
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display: none;"></canvas>

  <script>
    const { jsPDF } = window.jspdf;

    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const convertBtn = document.getElementById('convertBtn');
    const extractionMode = document.getElementById('extractionMode');
    const intervalGroup = document.getElementById('intervalGroup');
    const countGroup = document.getElementById('countGroup');
    const intervalMsInput = document.getElementById('intervalMs');
    const totalFramesInput = document.getElementById('totalFrames');
    const pageSizeSelect = document.getElementById('pageSize');
    const leftMarginInput = document.getElementById('leftMarginInput');
    const scaleModeSelect = document.getElementById('scaleMode');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const ctx = hiddenCanvas.getContext('2d');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const pdfPreviewWrapper = document.getElementById('pdfPreviewWrapper');
    const pdfPreview = document.getElementById('pdfPreview');

    let currentPdfUrl = null;

    extractionMode.addEventListener('change', () => {
      if (extractionMode.value === 'interval') {
        intervalGroup.style.display = 'flex';
        countGroup.style.display = 'none';
      } else {
        intervalGroup.style.display = 'none';
        countGroup.style.display = 'flex';
      }
    });

    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        videoPlayer.src = URL.createObjectURL(file);
        videoPlayer.style.display = 'block';
        convertBtn.disabled = false;
        pdfPreviewWrapper.style.display = 'none';
        statusText.textContent = 'Video loaded. Ready to generate PDF.';
      }
    });

    function seekToTime(video, time) {
      return new Promise((resolve) => {
        const onSeeked = () => {
          video.removeEventListener('seeked', onSeeked);
          setTimeout(resolve, 50);
        };
        video.addEventListener('seeked', onSeeked);
        video.currentTime = time;
      });
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    convertBtn.addEventListener('click', async () => {
      if (!videoPlayer.src) return;

      convertBtn.disabled = true;
      pdfPreviewWrapper.style.display = 'none';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';

      if (currentPdfUrl) {
        URL.revokeObjectURL(currentPdfUrl);
      }

      const duration = videoPlayer.duration;
      let timeSteps = [];

      if (extractionMode.value === 'interval') {
        const intervalSec = (parseFloat(intervalMsInput.value) || 1000) / 1000;
        let t = 0;
        while (t < duration) {
          timeSteps.push(t);
          t += intervalSec;
        }
      } else {
        const targetCount = parseInt(totalFramesInput.value) || 10;
        if (targetCount === 1) {
          timeSteps.push(0);
        } else {
          const step = duration / (targetCount - 1);
          for (let i = 0; i < targetCount; i++) {
            timeSteps.push(Math.min(i * step, duration - 0.01));
          }
        }
      }

      const format = pageSizeSelect.value;
      const leftMarginInches = parseFloat(leftMarginInput.value) || 0;
      const scaleMode = scaleModeSelect.value;
      let pdf = null;

      for (let i = 0; i < timeSteps.length; i++) {
        const currentTime = timeSteps[i];
        statusText.textContent = `Processing frame ${i + 1} of ${timeSteps.length} (${currentTime.toFixed(2)}s)...`;

        await seekToTime(videoPlayer, currentTime);

        const imgWidth = videoPlayer.videoWidth;
        const imgHeight = videoPlayer.videoHeight;
        const orientation = imgWidth > imgHeight ? 'landscape' : 'portrait';

        if (i === 0) {
          pdf = new jsPDF({
            orientation: orientation,
            unit: 'mm',
            format: format
          });
        } else {
          pdf.addPage(format, orientation);
        }

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const leftMarginMm = leftMarginInches * 25.4;
        const availableWidth = Math.max(10, pdfWidth - leftMarginMm);

        const targetW = 1200;
        const targetH = Math.round(targetW * (pdfHeight / availableWidth));

        hiddenCanvas.width = targetW;
        hiddenCanvas.height = targetH;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetW, targetH);

        if (scaleMode === 'cover') {
          const targetAspect = availableWidth / pdfHeight;
          const imgAspect = imgWidth / imgHeight;

          let sWidth, sHeight, sx, sy;
          if (imgAspect > targetAspect) {
            sHeight = imgHeight;
            sWidth = imgHeight * targetAspect;
            sx = (imgWidth - sWidth) / 2;
            sy = 0;
          } else {
            sWidth = imgWidth;
            sHeight = imgWidth / targetAspect;
            sx = 0;
            sy = (imgHeight - sHeight) / 2;
          }

          ctx.drawImage(videoPlayer, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
        } else {
          ctx.drawImage(videoPlayer, 0, 0, imgWidth, imgHeight, 0, 0, targetW, targetH);
        }

        const processedImageData = hiddenCanvas.toDataURL('image/jpeg', 0.95);
        pdf.addImage(processedImageData, 'JPEG', leftMarginMm, 0, availableWidth, pdfHeight);

        const progress = ((i + 1) / timeSteps.length) * 100;
        progressBar.style.width = `${progress}%`;
      }

      statusText.textContent = 'Generating final PDF...';
      const pdfBlob = pdf.output('blob');
      currentPdfUrl = URL.createObjectURL(pdfBlob);
      pdfPreview.src = currentPdfUrl;
      pdfPreviewWrapper.style.display = 'block';

      statusText.textContent = `Done! Processed ${timeSteps.length} frames into PDF.`;
      convertBtn.disabled = false;
      setTimeout(() => { progressContainer.style.display = 'none'; }, 1000);
    });
  </script>
</body>
</html>
